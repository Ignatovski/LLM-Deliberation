condition_set_id: mock_demo_v1
description: "Runnable mock/demo condition set for scaffold validation"
conditions:
  - condition_id: C1
    enabled: true
    mode: negotiation
    priors:
      apply_in_round0_only: true
      text: "You are negotiating with other LLMs."
    models_by_role:
      R: mock-default
      C: mock-default
      K: mock-default
    prompt_options:
      re_inject_role_instruction_in_roundn: false
      reminder_text: "Stay evidence-grounded and cite valid line IDs."
    runtime:
      public_messages: 6
      json_max_retries: 3
      provider_timeout_seconds: 10
      per_run_wallclock_limit_seconds: 120
      token_budget_limit: null
      final_turn_announcement_window: 1
      parallel_runs: false
      public_message_min_words: 80
      public_message_max_words: 150
      public_message_hard_cap_words: 220
  - condition_id: C2
    enabled: true
    mode: baseline
    priors:
      apply_in_round0_only: true
      text: "You are performing a one-shot solo review."
    baseline_model: mock-default
    runtime:
      json_max_retries: 3
      provider_timeout_seconds: 10
      per_run_wallclock_limit_seconds: 60
      token_budget_limit: null
      public_message_min_words: 80
      public_message_max_words: 150
      public_message_hard_cap_words: 220

